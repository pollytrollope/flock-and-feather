// ── SHARED UI ─────────────────────────────────────────────────────────────────
function Pill({label,type="ok"}){
  const s={ok:{bg:C.greenLight,c:C.green},warn:{bg:C.amberLight,c:C.amber},alert:{bg:C.redLight,c:C.red},blue:{bg:C.blueLight,c:C.blue},muted:{bg:C.bgMuted,c:C.textMuted}};
  const t=s[type]||s.ok;

}
function WCard({children,style}){return <div style={{background:C.bgCard,borderRadius:16,padding:"16px 18px",border:`1px solid ${C.borderLight}`,boxShadow:"0 1px 4px rgba(0,0,0,0.04)",marginBottom:14,...style}}>{children}</div>;}
function MCard({children,style}){return <div style={{background:C.bgMuted,borderRadius:14,padding:"14px 16px",border:`1px solid ${C.border}`,marginBottom:14,...style}}>{children}</div>;}
function GCard({children,style}){return <div style={{background:C.green,borderRadius:16,padding:"18px 20px",marginBottom:14,...style}}>{children}</div>;}
function SecTitle({title,sub,action,onAction}){
  return <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
    <div>
      <div style={{fontFamily:FS.serif,fontSize:22,fontWeight:600,color:C.text}}>{title}</div>
      {sub&&<div style={{fontFamily:FS.sans,fontSize:12,color:C.textMuted,marginTop:1}}>{sub}</div>}
    </div>
    {action&&<button onClick={onAction} style={{background:C.green,color:"#fff",border:"none",borderRadius:22,padding:"8px 16px",fontFamily:FS.sans,fontSize:12.5,fontWeight:500,cursor:"pointer"}}>+ {action}</button>}
  </div>;
}
function UAvatar({ini,size=36,bg,col}){
  return <div style={{width:size,height:size,borderRadius:"50%",background:bg||C.greenLight,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.38,fontFamily:FS.sans,fontWeight:700,color:col||C.green,flexShrink:0}}>{ini}</div>;
}
function HenAv({hen,size=44}){
  if(hen.photo){
    const sc=hen.photoScale||1,ox=hen.photoOffsetX||0,oy=hen.photoOffsetY||0;
    return <div style={{width:size,height:size,borderRadius:size/3,overflow:"hidden",border:`2px solid ${hen.color}55`,flexShrink:0,position:"relative"}}>
      <img src={hen.photo} alt={hen.name} style={{position:"absolute",width:`${sc*100}%`,height:`${sc*100}%`,objectFit:"cover",left:`${50+ox}%`,top:`${50+oy}%`,transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>
    </div>;
  }
  return <div style={{width:size,height:size,borderRadius:size/3,background:hen.color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.48,border:`1.5px solid ${hen.color}44`,flexShrink:0}}>{hen.emoji||"🐓"}</div>;
}
function SubTabs({tabs,active,onChange}){
  return <div style={{display:"flex",background:C.bgMuted,borderRadius:12,padding:4,marginBottom:18,border:`1px solid ${C.border}`}}>
    {tabs.map(t=><button key={t.key} onClick={()=>onChange(t.key)} style={{flex:1,background:active===t.key?C.bgCard:"transparent",color:active===t.key?C.text:C.textMuted,border:"none",borderRadius:9,padding:"8px 4px",fontSize:11.5,cursor:"pointer",fontFamily:FS.sans,fontWeight:active===t.key?600:400,boxShadow:active===t.key?"0 1px 4px rgba(0,0,0,0.07)":"none"}}>{t.label}</button>)}
  </div>;
}
function ChkItem({task,checked,onChange}){
  return <div onClick={onChange} style={{display:"flex",alignItems:"center",gap:14,padding:"13px 0",borderBottom:`1px solid ${C.borderLight}`,cursor:"pointer"}}>
    <div style={{width:22,height:22,borderRadius:7,border:`1.5px solid ${checked?C.green:C.border}`,background:checked?C.green:"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
      {checked&&<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
    </div>
    <div style={{flex:1}}>
      <div style={{fontFamily:FS.sans,fontSize:14,color:checked?C.textMuted:C.text,textDecoration:checked?"line-through":"none",fontWeight:500}}>{task.label}</div>
      <div style={{fontFamily:FS.sans,fontSize:12,color:C.textMuted,marginTop:1}}>{task.sub}</div>
    </div>

}
function AIBox({label,content,color=C.green}){
  return <div style={{background:color+"0D",border:`1px solid ${color}33`,borderRadius:12,padding:"14px 16px",marginTop:12}}>
    <div style={{fontFamily:FS.serif,fontWeight:600,fontSize:14,color,marginBottom:6}}>{label}</div>
    <div style={{fontFamily:FS.sans,fontSize:13,color:C.text,lineHeight:1.75,whiteSpace:"pre-wrap"}}>{content}</div>
    <div style={{marginTop:8,fontSize:11,color:C.textMuted,fontStyle:"italic"}}>⚕️ Not veterinary advice — always consult a poultry vet.</div>
  </div>;
}

// KEY FIX: StableInput never re-renders from parent, keyboard stays up always
const StableInput = React.memo(function StableInput({defaultValue, onBlurSave, placeholder, style, type, inputRef}){
  return <input
    ref={inputRef}
    type={type||"text"}
    defaultValue={defaultValue||""}
    onBlur={e=>onBlurSave(e.target.value)}
    placeholder={placeholder||""}
    autoComplete="off"
    autoCorrect="off"
    autoCapitalize="sentences"
    style={{...style, fontSize:"16px"}}
  />;
});

const StableTextarea = React.memo(function StableTextarea({defaultValue, onBlurSave, placeholder, style}){
  return <textarea
    defaultValue={defaultValue||""}
    onBlur={e=>onBlurSave(e.target.value)}
    placeholder={placeholder||""}
    autoComplete="off"
    style={{...style, fontSize:"16px"}}
  />;
});

// ── PHOTO CROP ────────────────────────────────────────────────────────────────
function PhotoCrop({src,scale,ox,oy,onScale,onOffset,onReset,onConfirm}){
  const dragging=useRef(false);
  const last=useRef({x:0,y:0});
  const onTD=e=>{dragging.current=true;last.current={x:e.touches[0].clientX,y:e.touches[0].clientY};};
  const onTM=e=>{
    if(!dragging.current)return;
    const dx=((e.touches[0].clientX-last.current.x)/100)*8;
    const dy=((e.touches[0].clientY-last.current.y)/100)*8;
    last.current={x:e.touches[0].clientX,y:e.touches[0].clientY};
    onOffset(p=>Math.max(-40,Math.min(40,p+dx)),p=>Math.max(-40,Math.min(40,p+dy)));
    e.preventDefault();
  };
  return <div style={{background:C.bgMuted,borderRadius:16,padding:18,border:`1px solid ${C.border}`,marginBottom:14}}>
    <div style={{fontFamily:FS.sans,fontWeight:600,fontSize:13,color:C.text,marginBottom:3}}>Adjust your photo</div>
    <div style={{fontFamily:FS.sans,fontSize:12,color:C.textMuted,marginBottom:14}}>Drag to move · slider to zoom</div>
    <div style={{display:"flex",justifyContent:"center",marginBottom:18}}>
      <div onTouchStart={onTD} onTouchMove={onTM} onTouchEnd={()=>{dragging.current=false;}}
        style={{width:130,height:130,borderRadius:26,overflow:"hidden",border:`3px solid ${C.green}`,position:"relative",touchAction:"none",userSelect:"none"}}>
        <img src={src} alt="preview" style={{position:"absolute",width:`${scale*100}%`,height:`${scale*100}%`,objectFit:"cover",left:`${50+ox}%`,top:`${50+oy}%`,transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>
      </div>
    </div>
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
        <span style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted}}>Zoom</span>
        <span style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted}}>{Math.round(scale*100)}%</span>
      </div>
      <input type="range" min="50" max="200" step="1" value={scale*100} onChange={e=>onScale(Number(e.target.value)/100)} style={{width:"100%",accentColor:C.green,fontSize:"16px"}}/>
    </div>
    <div style={{display:"flex",gap:9}}>
      <button onClick={onConfirm} style={{flex:1,background:C.green,color:"#fff",border:"none",borderRadius:10,padding:"12px 0",fontFamily:FS.sans,fontSize:14,cursor:"pointer",fontWeight:500}}>Use this photo ✓</button>
      <button onClick={onReset} style={{background:C.bgCard,color:C.textMid,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",fontFamily:FS.sans,fontSize:14,cursor:"pointer"}}>Reset</button>
    </div>
  </div>;
}

// ── HEN FORM ──────────────────────────────────────────────────────────────────
// Uses uncontrolled inputs (defaultValue + onBlur) so keyboard NEVER dismisses
function HenForm({initial, onSave, onCancel, onDelete, onMemorial}){
  // Use refs to hold latest values without causing re-renders
  const nameRef = useRef(initial?.name||"");
  const ageRef  = useRef(initial?.age||"");
  const notesRef= useRef(initial?.notes||"");
  const memDateRef = useRef("");
  const memNoteRef = useRef("");
  const newMedRef  = useRef("");

  const [form, setForm] = useState({
    breed: initial?.breed||"",
    dob:   initial?.dob||"",
    color: initial?.color||HEN_COLORS[0],
    emoji: initial?.emoji||"🐓",
    inLay: initial?.inLay||false,
    photo: initial?.photo||null,
    photoScale:   initial?.photoScale||1,
    photoOffsetX: initial?.photoOffsetX||0,
    photoOffsetY: initial?.photoOffsetY||0,
    meds:    initial?.meds||[],
    welfare: initial?.welfare||{},
  });
  const [rawPhoto,   setRawPhoto]   = useState(initial?.photo||null);
  const [editPhoto,  setEditPhoto]  = useState(false);
  const [cropScale,  setCropScale]  = useState(initial?.photoScale||1);
  const [cropX,      setCropX]      = useState(initial?.photoOffsetX||0);
  const [cropY,      setCropY]      = useState(initial?.photoOffsetY||0);
  const [detecting,  setDetecting]  = useState(false);
  const [breedAI,    setBreedAI]    = useState(null);
  const [showMem,    setShowMem]    = useState(false);
  const [medInput,   setMedInput]   = useState(""); // only one controlled input - for add button enable
  const fileRef = useRef();

  const iS = {
    width:"100%", padding:"14px", borderRadius:10,
    border:`1px solid ${C.border}`, fontFamily:FS.sans,
    fontSize:"16px", color:C.text, background:C.bgMuted,
    outline:"none", boxSizing:"border-box", WebkitAppearance:"none",
    display:"block",
  };

  const handleFile = e => {
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = ev => { setRawPhoto(ev.target.result); setCropScale(1); setCropX(0); setCropY(0); setEditPhoto(true); setBreedAI(null); };
    r.readAsDataURL(file);
  };

  const confirmCrop = async () => {
    setForm(f=>({...f,photo:rawPhoto,photoScale:cropScale,photoOffsetX:cropX,photoOffsetY:cropY}));
    setEditPhoto(false);
    setDetecting(true);
    try{
      const b64 = rawPhoto.includes(",") ? rawPhoto.split(",")[1] : rawPhoto;
      const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:300,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:'Identify this chicken breed. Reply ONLY with JSON: {"breed":"name","confidence":"high/medium/low","alternatives":["alt1"],"notes":"brief reason"}'}]}]})});
      const d = await res.json();
      const txt = d.content?.map(b=>b.text||"").join("").trim().replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(txt);
      setBreedAI(parsed);
      if(parsed.confidence!=="low") setForm(f=>({...f,breed:parsed.breed}));
    }catch(e){ setBreedAI(null); }
    setDetecting(false);
  };

  const addMed = () => {
    const val = newMedRef.current.trim();
    if(!val) return;
    setForm(f=>({...f,meds:[...(f.meds||[]),val]}));
    setMedInput("");
    newMedRef.current = "";
    // Clear the actual input element
    const el = document.getElementById("new-med-input");
    if(el) el.value = "";
  };

  const save = () => {
    const name = nameRef.current.trim();
    if(!name) return;
    onSave({...form, name, age:ageRef.current.trim(), notes:notesRef.current.trim()});
  };

  if(showMem) return (
    <div style={{paddingBottom:40}}>
      <div style={{fontFamily:FS.serif,fontSize:22,fontWeight:600,color:C.text,marginBottom:8}}>🕊️ In Memory of {nameRef.current||initial?.name}</div>
      <div style={{fontFamily:FS.sans,fontSize:13,color:C.textMid,lineHeight:1.65,marginBottom:20}}>She will be moved to your memorial archive. Her diary, photos and records will be preserved forever.</div>
      <div style={{marginBottom:14}}>
        <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>Date she passed</div>
        <input type="date" defaultValue="" onBlur={e=>memDateRef.current=e.target.value} style={iS}/>
      </div>
      <div style={{marginBottom:20}}>
        <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>A note to remember her</div>
        <textarea defaultValue="" onBlur={e=>memNoteRef.current=e.target.value} placeholder="e.g. She was the boldest of the flock…" style={{...iS,minHeight:90,resize:"vertical",lineHeight:1.6}}/>
      </div>
      <div style={{display:"flex",gap:9}}>
        <button onClick={()=>onMemorial({...form,name:nameRef.current,age:ageRef.current,notes:notesRef.current,passedDate:memDateRef.current,memorialNote:memNoteRef.current})} style={{flex:1,background:"#7A5E9A",color:"#fff",border:"none",borderRadius:11,padding:"14px 0",fontFamily:FS.sans,fontSize:14,cursor:"pointer",fontWeight:500}}>🕊️ Move to Memorial</button>
        <button onClick={()=>setShowMem(false)} style={{background:C.bgMuted,color:C.textMid,border:`1px solid ${C.border}`,borderRadius:11,padding:"14px 16px",fontFamily:FS.sans,fontSize:14,cursor:"pointer"}}>Cancel</button>
      </div>
    </div>
  );

  return (
    <div style={{paddingBottom:60}}>
      <div style={{fontFamily:FS.serif,fontSize:24,fontWeight:600,color:C.text,marginBottom:22}}>{initial?`Edit ${initial.name}`:"Add a Hen"}</div>

      {/* Photo */}
      <div style={{marginBottom:18}}>
        <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>Photo</div>
        {editPhoto && rawPhoto
          ? <PhotoCrop src={rawPhoto} scale={cropScale} ox={cropX} oy={cropY}
              onScale={s=>setCropScale(s)}
              onOffset={(fx,fy)=>{setCropX(p=>typeof fx==="function"?fx(p):fx);setCropY(p=>typeof fy==="function"?fy(p):fy);}}
              onReset={()=>{setRawPhoto(null);setForm(f=>({...f,photo:null}));setEditPhoto(false);}}
              onConfirm={confirmCrop}/>
          : <div style={{display:"flex",alignItems:"center",gap:16}}>
              <div onClick={()=>fileRef.current.click()} style={{width:80,height:80,borderRadius:20,overflow:"hidden",border:`2px dashed ${C.border}`,background:C.bgMuted,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,position:"relative"}}>
                {form.photo ? <HenAv hen={form} size={80}/> : <div style={{textAlign:"center"}}><div style={{fontSize:28}}>{form.emoji}</div><div style={{fontFamily:FS.sans,fontSize:10,color:C.textMuted,marginTop:3}}>Tap</div></div>}
                <div style={{position:"absolute",bottom:0,right:0,width:24,height:24,borderRadius:"50%",background:C.green,display:"flex",alignItems:"center",justifyContent:"center",border:"2px solid #fff"}}>

                </div>
              </div>
              <div>
                <div style={{fontFamily:FS.sans,fontSize:13,color:C.text,fontWeight:500,marginBottom:3}}>Upload a photo</div>
                <div style={{fontFamily:FS.sans,fontSize:12,color:C.textMuted,lineHeight:1.5}}>AI will suggest her breed</div>
                {form.photo&&<button onClick={()=>setEditPhoto(true)} style={{background:"none",border:"none",color:C.blue,fontFamily:FS.sans,fontSize:12,cursor:"pointer",padding:"4px 0 0",display:"block"}}>Re-adjust</button>}
              </div>
            </div>}
        <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{display:"none"}}/>

      {detecting&&<div style={{background:C.goldLight,border:`1px solid ${C.goldBorder}`,borderRadius:12,padding:"12px 14px",marginBottom:16,fontFamily:FS.sans,fontSize:13,color:C.textMid}}>🔍 Identifying breed…</div>}
      {breedAI&&!detecting&&<div style={{background:C.greenLight,border:`1px solid ${C.green}44`,borderRadius:12,padding:"13px 15px",marginBottom:16}}>
        <div style={{fontFamily:FS.sans,fontWeight:600,fontSize:13,color:C.green,marginBottom:5}}>✨ AI thinks: <strong>{breedAI.breed}</strong> <span style={{fontWeight:400,color:C.textMuted}}>({breedAI.confidence})</span></div>
        {breedAI.notes&&<div style={{fontFamily:FS.sans,fontSize:12,color:C.textMid,marginBottom:8}}>{breedAI.notes}</div>}
        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          <button onClick={()=>setForm(f=>({...f,breed:breedAI.breed}))} style={{background:C.green,color:"#fff",border:"none",borderRadius:8,padding:"7px 12px",fontFamily:FS.sans,fontSize:12,cursor:"pointer",fontWeight:500}}>✓ Use {breedAI.breed}</button>
          {breedAI.alternatives?.map(a=><button key={a} onClick={()=>setForm(f=>({...f,breed:a}))} style={{background:C.bgCard,color:C.text,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 12px",fontFamily:FS.sans,fontSize:12,cursor:"pointer"}}>{a}</button>)}
        </div>
      </div>}

      {/* NAME — uncontrolled */}
      <div style={{marginBottom:16}}>
        <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>Name *</div>
        <input
          defaultValue={initial?.name||""}
          onChange={e=>nameRef.current=e.target.value}
          placeholder="e.g. Margot"
          autoComplete="off" autoCorrect="off"
          style={iS}
        />
      </div>

      {/* BREED */}
      <div style={{marginBottom:16}}>
        <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>Breed</div>
        <select value={form.breed} onChange={e=>setForm(f=>({...f,breed:e.target.value}))} style={{...iS,backgroundImage:"url(\"data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 7L11 1' stroke='%239A9488' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E\")",backgroundRepeat:"no-repeat",backgroundPosition:"right 14px center",paddingRight:40}}>
          <option value="">Select breed…</option>
          {BREEDS.map(b=><option key={b} value={b}>{b}</option>)}
        </select>
      </div>

      {/* AGE — uncontrolled */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
        <div>
          <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>Age</div>
          <input defaultValue={initial?.age||""} onChange={e=>ageRef.current=e.target.value} placeholder="e.g. 2 yrs" autoComplete="off" style={iS}/>
        </div>
        <div>
          <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>Date of birth</div>
          <input type="date" value={form.dob} onChange={e=>setForm(f=>({...f,dob:e.target.value}))} style={iS}/>
        </div>
      </div>

      {/* EMOJI */}
      {!form.photo&&<div style={{marginBottom:16}}>
        <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>Icon</div>
        <div style={{display:"flex",gap:8}}>{EMOJIS.map(e=><button key={e} onClick={()=>setForm(f=>({...f,emoji:e}))} style={{width:46,height:46,borderRadius:12,border:`2px solid ${form.emoji===e?C.green:C.border}`,background:form.emoji===e?C.greenLight:C.bgMuted,fontSize:22,cursor:"pointer"}}>{e}</button>)}</div>
      </div>}

      {/* COLOUR */}
      <div style={{marginBottom:16}}>
        <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>Colour accent</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>{HEN_COLORS.map(col=><button key={col} onClick={()=>setForm(f=>({...f,color:col}))} style={{width:34,height:34,borderRadius:"50%",background:col,border:`3px solid ${form.color===col?C.text:"transparent"}`,cursor:"pointer",outline:"none"}}/>)}</div>
      </div>

      {/* LAYING */}
      <div style={{marginBottom:16}}>
        <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>Currently laying?</div>
        <div style={{display:"flex",gap:8}}>
          {[{v:true,l:"Yes — in lay 🥚"},{v:false,l:"Not in lay"}].map(opt=>
            <button key={String(opt.v)} onClick={()=>setForm(f=>({...f,inLay:opt.v}))} style={{flex:1,background:form.inLay===opt.v?C.green:C.bgMuted,color:form.inLay===opt.v?"#fff":C.text,border:`1px solid ${form.inLay===opt.v?C.green:C.border}`,borderRadius:10,padding:"12px 0",fontFamily:FS.sans,fontSize:14,cursor:"pointer",fontWeight:form.inLay===opt.v?500:400}}>{opt.l}</button>
          )}
        </div>
      </div>

      {/* MEDS */}
      <div style={{marginBottom:16}}>
        <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>Medications</div>
        {(form.meds||[]).map((m,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,background:C.blueLight,border:`1px solid ${C.blue}33`,borderRadius:9,padding:"10px 12px",marginBottom:6}}>
          <span style={{fontSize:16}}>💊</span><span style={{flex:1,fontFamily:FS.sans,fontSize:13,color:C.text}}>{m}</span>
          <button onClick={()=>setForm(f=>({...f,meds:f.meds.filter((_,j)=>j!==i)}))} style={{background:"none",border:"none",color:C.red,fontSize:20,cursor:"pointer",lineHeight:1,padding:"0 4px"}}>×</button>
        </div>)}
        <div style={{display:"flex",gap:8}}>
          <input
            id="new-med-input"
            defaultValue=""
            onChange={e=>{newMedRef.current=e.target.value; setMedInput(e.target.value);}}
            onKeyDown={e=>e.key==="Enter"&&addMed()}
            placeholder="e.g. Flubenvet, Ivermectin…"
            autoComplete="off"
            style={{...iS,flex:1}}
          />
          <button onClick={addMed} style={{background:C.blue,color:"#fff",border:"none",borderRadius:10,padding:"12px 14px",fontFamily:FS.sans,fontSize:14,cursor:"pointer",fontWeight:500,whiteSpace:"nowrap"}}>+ Add</button>
        </div>
      </div>

      {/* WELFARE */}
      <div style={{marginBottom:16}}>
        <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>Welfare Profile</div>
        <WCard style={{marginBottom:0}}>
          {WELFARE_CONDITIONS.map((w,i)=>{
            const val=form.welfare?.[w.id]||0;
            const bgs=[C.greenLight,C.amberLight,C.redLight];
            const cols=[C.green,C.amber,C.red];
            return <div key={w.id} style={{marginBottom:i<WELFARE_CONDITIONS.length-1?16:0,paddingBottom:i<WELFARE_CONDITIONS.length-1?16:0,borderBottom:i<WELFARE_CONDITIONS.length-1?`1px solid ${C.borderLight}`:"none"}}>
              <div style={{fontFamily:FS.sans,fontSize:13,fontWeight:500,color:C.text,marginBottom:8}}>{w.icon} {w.label}</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {w.opts.map((opt,idx)=><button key={opt} onClick={()=>setForm(f=>({...f,welfare:{...(f.welfare||{}),[w.id]:idx}}))} style={{background:val===idx?bgs[idx]:C.bgMuted,color:val===idx?cols[idx]:C.textMid,border:`1.5px solid ${val===idx?cols[idx]+"55":C.border}`,borderRadius:8,padding:"8px 11px",fontFamily:FS.sans,fontSize:12,cursor:"pointer",fontWeight:val===idx?600:400}}>
                  {idx===0?"✅ ":idx===1?"⚠️ ":"🚨 "}{opt}
                </button>)}
              </div>
            </div>;
          })}
        </WCard>
      </div>

      {/* NOTES — uncontrolled */}
      <div style={{marginBottom:20}}>
        <div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:8}}>Notes</div>
        <textarea
          defaultValue={initial?.notes||""}
          onChange={e=>notesRef.current=e.target.value}
          placeholder="e.g. rehomed March 2025, nervous around handling…"
          style={{...iS,minHeight:90,resize:"vertical",lineHeight:1.6}}
        />
      </div>

      <div style={{display:"flex",gap:9}}>
        <button onClick={save} style={{flex:1,background:C.green,color:"#fff",border:"none",borderRadius:11,padding:"14px 0",fontFamily:FS.sans,fontSize:15,cursor:"pointer",fontWeight:500}}>{initial?"Save Changes":"Add to Flock ✓"}</button>
        <button onClick={onCancel} style={{background:C.bgMuted,color:C.textMid,border:`1px solid ${C.border}`,borderRadius:11,padding:"14px 16px",fontFamily:FS.sans,fontSize:15,cursor:"pointer"}}>Cancel</button>
      </div>
      {initial&&<>
        {onMemorial&&<button onClick={()=>setShowMem(true)} style={{width:"100%",marginTop:10,background:"#F5F0FB",color:"#7A5E9A",border:"1px solid #C4A8D844",borderRadius:11,padding:"12px 0",fontFamily:FS.sans,fontSize:13,cursor:"pointer"}}>🕊️ {initial.name} has passed away…</button>}
        {onDelete&&<button onClick={onDelete} style={{width:"100%",marginTop:8,background:"none",border:`1px solid ${C.red}44`,color:C.red,borderRadius:11,padding:"12px 0",fontFamily:FS.sans,fontSize:13,cursor:"pointer"}}>Remove {initial.name} from flock</button>}
      </>}
    </div>
  );
}

// ── HEADER ────────────────────────────────────────────────────────────────────
function Header({hens,tasks}){
  const done=Object.values(tasks).filter(Boolean).length;
  const eggs=hens.reduce((a,h)=>a+(h.eggsToday||0),0);
  return <div style={{background:C.headerBg,padding:"20px 20px 16px",flexShrink:0}}>
    <div style={{display:"flex",alignItems:"center",gap:13,marginBottom:14}}>
      <div style={{width:46,height:46,borderRadius:14,background:"rgba(255,255,255,0.11)",display:"flex",alignItems:"center",justifyContent:"center",border:"1px solid rgba(255,255,255,0.14)"}}>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B89A6A" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>
      </div>
      <div>
        <div style={{fontFamily:FS.serif,fontSize:26,fontWeight:600,color:"#F5F0E8",lineHeight:1}}>Flock & Feather</div>
        <div style={{fontFamily:FS.sans,fontSize:10,color:"rgba(255,255,255,0.45)",letterSpacing:"0.2em",textTransform:"uppercase",marginTop:3}}>Hen Welfare Tracker</div>
      </div>
    </div>
    <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
      {[`${hens.length} hens`,`${eggs} today`,`${EGG_WEEK.reduce((a,b)=>a+b,0)} this week`,`${done}/${CARE_TASKS.length} tasks`].map(l=>
        <div key={l} style={{border:"1px solid rgba(255,255,255,0.2)",borderRadius:20,padding:"5px 12px",fontFamily:FS.sans,fontSize:12,color:"rgba(255,255,255,0.8)",background:"rgba(255,255,255,0.07)"}}>{l}</div>
      )}
    </div>
  </div>;
}

// ── CARE TAB ──────────────────────────────────────────────────────────────────
function CareTab({hens,tasks,setTasks}){
  const done=Object.values(tasks).filter(Boolean).length;
  const pct=Math.round((done/CARE_TASKS.length)*100);
  const eggs=hens.reduce((a,h)=>a+(h.eggsToday||0),0);
  const alerts=hens.flatMap(h=>(h.alerts||[]).map(a=>({hen:h,alert:a})));
  const meds=hens.flatMap(h=>(h.meds||[]).map(m=>({hen:h,med:m})));
  return <div>
    <GCard>
      <div style={{fontFamily:FS.sans,fontSize:11,color:"rgba(255,255,255,0.55)",letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:3}}>{TODAY}</div>
      <div style={{fontFamily:FS.serif,fontSize:20,fontWeight:600,color:"#F5F0E8",marginBottom:14}}>Good morning, Sarah</div>
      <div style={{background:"rgba(255,255,255,0.15)",borderRadius:10,height:6,marginBottom:7}}><div style={{background:pct===100?"#7FBF7F":C.gold,borderRadius:10,height:6,width:`${pct}%`,transition:"width 0.4s"}}/></div>
      <div style={{fontFamily:FS.sans,fontSize:12,color:"rgba(255,255,255,0.7)"}}>{done} of {CARE_TASKS.length} tasks complete{pct===100?" 🎉":""}</div>
    </GCard>
    <WCard>
      <div style={{fontFamily:FS.serif,fontSize:17,fontWeight:600,color:C.text,marginBottom:12}}>Who's helping today</div>
      <div style={{display:"flex",gap:14}}>
        {MEMBERS.map(m=><div key={m.id} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
          <div style={{position:"relative"}}>
            <UAvatar ini={m.av} size={44} bg={m.color+"18"} col={m.color}/>
            <div style={{position:"absolute",bottom:1,right:1,width:11,height:11,borderRadius:"50%",background:m.online?"#5FA85F":C.border,border:"2px solid #fff"}}/>
          </div>
          <div style={{fontFamily:FS.sans,fontSize:11,color:m.online?C.text:C.textMuted,fontWeight:m.online?500:400}}>{m.name}</div>
          <div style={{fontFamily:FS.sans,fontSize:10,color:m.online?"#5FA85F":C.textMuted}}>{m.online?"Online":"Offline"}</div>
        </div>)}
      </div>
    </WCard>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
      <GCard style={{padding:"16px 18px",marginBottom:0}}>
        <div style={{fontFamily:FS.sans,fontSize:10,color:"rgba(255,255,255,0.5)",textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:4}}>Eggs today</div>
        <div style={{fontFamily:FS.serif,fontSize:38,fontWeight:600,color:"#fff",lineHeight:1}}>{eggs}</div>
      </GCard>
      <WCard style={{padding:"16px 18px",marginBottom:0}}>
        <div style={{fontFamily:FS.sans,fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:4}}>This week</div>
        <div style={{fontFamily:FS.serif,fontSize:38,fontWeight:600,color:C.text,lineHeight:1}}>{EGG_WEEK.reduce((a,b)=>a+b,0)}</div>
      </WCard>
    </div>
    {alerts.length>0&&<div style={{background:C.amberLight,border:`1px solid ${C.goldBorder}`,borderRadius:14,padding:"14px 16px",marginBottom:14}}>
      <div style={{fontFamily:FS.sans,fontWeight:600,fontSize:13,color:C.amber,marginBottom:10}}>⚠️ Welfare Alerts</div>
      {alerts.map((a,i)=><div key={i} style={{display:"flex",gap:10,marginBottom:i<alerts.length-1?8:0}}><HenAv hen={a.hen} size={26}/><div style={{fontFamily:FS.sans,fontSize:12.5,color:C.textMid}}><strong style={{color:C.text}}>{a.hen.name}:</strong> {a.alert}</div></div>)}
    </div>}
    {meds.length>0&&<div style={{background:C.blueLight,border:`1px solid ${C.blue}33`,borderRadius:14,padding:"14px 16px",marginBottom:14}}>
      <div style={{fontFamily:FS.sans,fontWeight:600,fontSize:13,color:C.blue,marginBottom:10}}>💊 Medications Active</div>
      {meds.map((m,i)=><div key={i} style={{display:"flex",gap:10,marginBottom:i<meds.length-1?7:0}}><HenAv hen={m.hen} size={24}/><span style={{fontFamily:FS.sans,fontSize:12.5,color:C.text}}><strong>{m.hen.name}:</strong> {m.med}</span></div>)}
    </div>}
    <div style={{background:C.goldLight,border:`1px solid ${C.goldBorder}`,borderRadius:14,padding:"13px 16px",marginBottom:14,display:"flex",gap:12}}>
      <span style={{fontSize:22}}>☀️</span>
      <div><div style={{fontFamily:FS.sans,fontWeight:600,fontSize:13,color:C.green,marginBottom:3}}>Summer Care</div><div style={{fontFamily:FS.sans,fontSize:12.5,color:C.textMid,lineHeight:1.65}}>Red mite populations spike in warm weather. Check perches every 3–4 days.</div></div>
    </div>
    <SecTitle title="Daily Checklist" sub={`${done}/${CARE_TASKS.length} complete`}/>
    <WCard>
      {CARE_TASKS.map(t=><ChkItem key={t.id} task={t} checked={!!tasks[t.id]} onChange={()=>setTasks(p=>({...p,[t.id]:!p[t.id]}))}/>)}
      <div style={{paddingTop:4}}/>
    </WCard>
  </div>;
}

// ── FLOCK TAB ─────────────────────────────────────────────────────────────────
function FlockTab({hens,setHens,memHens,setMemHens,setActiveHen}){
  const [mode,setMode]=useState("list");
  const [editing,setEditing]=useState(null);
  const add=f=>{setHens(p=>[...p,{...f,id:Date.now(),alerts:[],eggsToday:0}]);setMode("list");};
  const save=f=>{setHens(p=>p.map(h=>h.id===editing.id?{...h,...f}:h));setMode("list");setEditing(null);};
  const del=()=>{setHens(p=>p.filter(h=>h.id!==editing.id));setMode("list");setEditing(null);};
  const mem=f=>{setMemHens(p=>[...p,{...f,id:editing.id,archivedAt:new Date().toLocaleDateString("en-GB")}]);setHens(p=>p.filter(h=>h.id!==editing.id));setMode("list");setEditing(null);};
  if(mode==="add") return <HenForm onSave={add} onCancel={()=>setMode("list")}/>;
  if(mode==="edit") return <HenForm initial={editing} onSave={save} onCancel={()=>setMode("list")} onDelete={del} onMemorial={mem}/>;
  return <div>
    <SecTitle title="My Flock" sub={hens.length>0?`${hens.length} hen${hens.length!==1?"s":""} · ${hens.filter(h=>h.inLay).length} in lay`:"Add your first hen"} action="Add Hen" onAction={()=>setMode("add")}/>
    {hens.length===0&&<div style={{textAlign:"center",padding:"48px 24px",background:C.bgMuted,borderRadius:18,border:`1px dashed ${C.border}`,marginBottom:16}}>
      <div style={{fontSize:52,marginBottom:14}}>🐣</div>
      <div style={{fontFamily:FS.serif,fontSize:22,fontWeight:600,color:C.textMid,marginBottom:8}}>No hens yet</div>
      <div style={{fontFamily:FS.sans,fontSize:13,color:C.textMuted,lineHeight:1.65,maxWidth:240,margin:"0 auto 20px"}}>Tap "Add Hen" to build your flock.</div>
      <button onClick={()=>setMode("add")} style={{background:C.green,color:"#fff",border:"none",borderRadius:22,padding:"12px 24px",fontFamily:FS.sans,fontSize:14,cursor:"pointer",fontWeight:500}}>+ Add your first hen</button>
    </div>}
    {hens.length>0&&<>
      <WCard>
        <div style={{fontFamily:FS.serif,fontSize:16,fontWeight:600,color:C.text,marginBottom:14}}>7-Day Egg Trend</div>
        <div style={{display:"flex",gap:5,alignItems:"flex-end",height:56}}>
          {["M","T","W","T","F","S","S"].map((d,i)=><div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
            <div style={{width:"100%",background:EGG_WEEK[i]>0?C.green:C.borderLight,borderRadius:4,height:`${Math.max(EGG_WEEK[i]*14,4)}px`}}/>
            <div style={{fontFamily:FS.sans,fontSize:10,color:C.textMuted}}>{d}</div>
            <div style={{fontFamily:FS.sans,fontSize:11,color:C.green,fontWeight:600}}>{EGG_WEEK[i]}</div>
          </div>)}
        </div>
      </WCard>
      <div style={{fontFamily:FS.serif,fontSize:18,fontWeight:600,color:C.text,marginBottom:12}}>Hen Profiles</div>
      {hens.map(h=><div key={h.id} style={{background:C.bgCard,border:`1px solid ${C.borderLight}`,borderRadius:16,overflow:"hidden",marginBottom:10,display:"flex",boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
        <div onClick={()=>setActiveHen(h)} style={{flex:1,padding:"14px 16px",display:"flex",alignItems:"center",gap:13,cursor:"pointer"}}>
          <HenAv hen={h} size={52}/>
          <div style={{flex:1}}>
            <div style={{fontFamily:FS.serif,fontSize:18,fontWeight:600,color:C.text}}>{h.name}</div>
            <div style={{fontFamily:FS.sans,fontSize:12,color:C.textMuted,marginTop:1}}>{h.breed||"Breed not set"}{h.age?` · ${h.age}`:""}</div>
            {h.inLay&&<div style={{fontFamily:FS.sans,fontSize:12,color:C.green,marginTop:3}}>🥚 {h.eggsToday||0} today</div>}
            <div style={{display:"flex",gap:5,marginTop:6,flexWrap:"wrap"}}>
              {(h.alerts||[]).length>0&&<Pill label={`⚠️ ${h.alerts.length} alert${h.alerts.length>1?"s":""}`} type="warn"/>}
              {(h.meds||[]).length>0&&<Pill label="💊 On meds" type="blue"/>}

            <span style={{fontSize:18,flexShrink:0}}>{cond.icon}</span>

                {val===0?"✅ ":val===1?"⚠️ ":"🚨 "}{cond.opts[val]}
              </div>
            </div>
          </div>;
        })}

  function HealthPanel(){
    const [markers,setMarkers]=useState({});
    const [inLay,setInLay]=useState(null);
    const [loading,setLoading]=useState(false);
    const [summary,setSummary]=useState("");
    const [notes,setNotes]=useState([]);
    const [saved,setSaved]=useState(false);
    const textRef=useRef("");
    const iS={width:"100%",padding:"14px",borderRadius:10,border:`1px solid ${C.border}`,fontFamily:FS.sans,fontSize:"16px",color:C.text,background:C.bgMuted,outline:"none",boxSizing:"border-box"};

      const txt=textRef.current;
      if(!txt.trim())return;setLoading(true);
      try{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:`You are a pet hen welfare assistant. Summarise this observation into 3–5 bullet points. Flag concerns with ⚠️. Do not diagnose.\n\nHen: ${hen.name} (${hen.breed||"unknown"})\nNote: "${txt}"`}]})});const d=await res.json();setSummary(d.content?.map(b=>b.text||"").join("")||"Could not summarise.");}

          </div>
        </div>)}
      </WCard>
      <WCard>
        <div style={{fontFamily:FS.serif,fontSize:18,fontWeight:600,color:C.text,marginBottom:12}}>Laying Status</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {["Laid today 🥚","Not in lay","Uncertain"].map(opt=><button key={opt} onClick={()=>setInLay(opt)} style={{background:inLay===opt?C.green:C.bgMuted,color:inLay===opt?"#fff":C.text,border:`1px solid ${inLay===opt?C.green:C.border}`,borderRadius:10,padding:"10px 14px",fontSize:13,cursor:"pointer",fontFamily:FS.sans,fontWeight:inLay===opt?500:400}}>{opt}</button>)}
        </div>
      </WCard>
      <WCard>
        <div style={{fontFamily:FS.serif,fontSize:18,fontWeight:600,color:C.text,marginBottom:10}}>Observation Note</div>
        <textarea id="obs-textarea" defaultValue="" onChange={e=>textRef.current=e.target.value} placeholder={`Type your observation for ${hen.name}…`} style={{...iS,minHeight:90,resize:"vertical",lineHeight:1.6}}/>
        <div style={{display:"flex",gap:9,marginTop:12}}>
          <button onClick={summarise} disabled={loading} style={{background:loading?C.textMuted:C.green,color:"#fff",border:"none",borderRadius:10,padding:"11px 16px",fontFamily:FS.sans,fontSize:13,cursor:loading?"default":"pointer",fontWeight:500}}>{loading?"Summarising…":"✨ AI Summarise"}</button>
          <button onClick={save} style={{background:C.greenLight,color:C.green,border:`1px solid ${C.green}44`,borderRadius:10,padding:"11px 16px",fontFamily:FS.sans,fontSize:13,cursor:"pointer",fontWeight:500}}>Save ✓</button>
        </div>
        {summary&&<AIBox label="✨ Summary" content={summary} color={C.green}/>}
        {saved&&<div style={{marginTop:10,background:C.greenLight,borderRadius:10,padding:"10px 13px",color:C.green,fontSize:13,fontFamily:FS.sans,fontWeight:500}}>✓ Saved</div>}
      </WCard>
      {notes.length>0&&<WCard>
        <div style={{fontFamily:FS.serif,fontSize:18,fontWeight:600,color:C.text,marginBottom:12}}>Diary Entries</div>
        {notes.map((n,i)=><div key={i} style={{background:C.bgMuted,borderRadius:10,padding:"11px 13px",marginBottom:8,border:`1px solid ${C.border}`}}>

  return <div>
    <button onClick={onBack} style={{background:"none",border:"none",color:C.textMid,fontFamily:FS.sans,fontSize:13,cursor:"pointer",padding:"0 0 14px",display:"flex",alignItems:"center",gap:5}}>

    <div style={{background:`linear-gradient(135deg,${hen.color}18,${hen.color}05)`,border:`1.5px solid ${hen.color}33`,borderRadius:20,padding:"18px 20px",marginBottom:18,display:"flex",alignItems:"center",gap:16}}>
      <HenAv hen={hen} size={56}/>
      <div>
        <div style={{fontFamily:FS.serif,fontSize:26,fontWeight:600,color:C.text}}>{hen.name}</div>
        <div style={{fontFamily:FS.sans,fontSize:12.5,color:C.textMid,marginTop:2}}>{hen.breed||"Breed not set"}{hen.age?` · ${hen.age}`:""}</div>

        </div>
      </div>
    </div>
    <SubTabs active={tab} onChange={setTab} tabs={[{key:"welfare",label:"🩺 Welfare"},{key:"health",label:"📋 Health"}]}/>
    {tab==="welfare"&&<WelfarePanel/>}
    {tab==="health"&&<HealthPanel/>}
  </div>;
}

      <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{sel.map(s=><span key={s} onClick={()=>toggle(s)} style={{background:C.green,color:"#fff",borderRadius:20,padding:"4px 11px",fontSize:12,fontFamily:FS.sans,cursor:"pointer"}}>{s} ×</span>)}</div>

}

    {sub==="feed"&&<>
      <WCard>
        <div style={{display:"flex",gap:10,marginBottom:11}}><UAvatar ini="S" size={36}/><textarea value={newPost} onChange={e=>setNewPost(e.target.value)} placeholder="Share a tip, question or welfare win…" style={{flex:1,minHeight:65,padding:"10px 12px",borderRadius:10,border:`1px solid ${C.border}`,fontFamily:FS.sans,fontSize:"16px",color:C.text,background:C.bgMuted,resize:"none",outline:"none"}}/></div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:11}}>{Object.entries(TYPE).map(([k,v])=><button key={k} onClick={()=>setPtype(k)} style={{background:ptype===k?v.c:C.bgMuted,color:ptype===k?"#fff":C.textMid,border:`1px solid ${ptype===k?v.c:C.border}`,borderRadius:20,padding:"6px 13px",fontSize:12,cursor:"pointer",fontFamily:FS.sans,fontWeight:ptype===k?500:400}}>{v.l}</button>)}</div>
        <button onClick={()=>{if(!newPost.trim())return;setPosts(p=>[{id:`p${Date.now()}`,user:"Sarah",ini:"S",time:"Just now",type:ptype,content:newPost,tags:[],likes:0,comments:0,loc:"South East England"},...p]);setNewPost("");}} disabled={!newPost.trim()} style={{background:newPost.trim()?C.green:C.border,color:"#fff",border:"none",borderRadius:10,padding:"10px 18px",fontFamily:FS.sans,fontSize:13,cursor:newPost.trim()?"pointer":"default",fontWeight:500}}>Share</button>
      </WCard>
      {posts.map(p=><WCard key={p.id}>
        <div style={{display:"flex",gap:10,marginBottom:10}}><UAvatar ini={p.ini} size={38}/><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}><span style={{fontFamily:FS.sans,fontWeight:600,fontSize:14,color:C.text}}>{p.user}</span><span style={{background:TYPE[p.type]?.bg,color:TYPE[p.type]?.c,borderRadius:20,padding:"2px 9px",fontSize:10.5,fontFamily:FS.sans,fontWeight:500}}>{TYPE[p.type]?.l}</span></div><div style={{fontFamily:FS.sans,fontSize:11,color:C.textMuted,marginTop:2}}>📍 {p.loc} · {p.time}</div></div></div>
        <div style={{fontFamily:FS.sans,fontSize:13.5,color:C.text,lineHeight:1.7,marginBottom:p.tags?.length?9:10}}>{p.content}</div>
        {p.tags?.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:10}}>{p.tags.map(t=><span key={t} style={{background:C.bgMuted,color:C.textMuted,borderRadius:20,padding:"3px 9px",fontSize:11,fontFamily:FS.sans}}>#{t}</span>)}</div>}
        <div style={{display:"flex",gap:14,borderTop:`1px solid ${C.borderLight}`,paddingTop:10}}>
          <button onClick={()=>setLiked(x=>({...x,[p.id]:!x[p.id]}))} style={{background:"none",border:"none",cursor:"pointer",fontFamily:FS.sans,fontSize:13,color:liked[p.id]?C.red:C.textMuted,display:"flex",alignItems:"center",gap:4}}>{liked[p.id]?"❤️":"🤍"} {p.likes+(liked[p.id]?1:0)}</button>
          <button style={{background:"none",border:"none",cursor:"pointer",fontFamily:FS.sans,fontSize:13,color:C.textMuted}}>💬 {p.comments}</button>
        </div>
      </WCard>)}
    </>}
    {sub==="ask"&&<>
      <GCard><div style={{fontFamily:FS.serif,fontSize:20,fontWeight:600,color:"#F5F0E8",marginBottom:3}}>✨ Ask the Hen Advisor</div><div style={{fontFamily:FS.sans,fontSize:12,color:"rgba(255,255,255,0.6)"}}>AI-powered answers for UK hen keepers.</div></GCard>
      <WCard>
        <textarea id="ai-question" defaultValue="" onChange={e=>qRef.current=e.target.value} placeholder="Ask anything about hen welfare, nutrition, behaviour…" style={{...iS,minHeight:90,resize:"vertical",lineHeight:1.6}}/>
        <button onClick={askAI} disabled={loading} style={{marginTop:12,background:loading?C.textMuted:C.green,color:"#fff",border:"none",borderRadius:10,padding:"12px 18px",fontFamily:FS.sans,fontSize:13,cursor:loading?"default":"pointer",fontWeight:500}}>{loading?"Thinking…":"Ask ✨"}</button>
        {ans&&<AIBox label="✨ Hen Advisor:" content={ans} color={C.green}/>}
      </WCard>
      <WCard>
        <div style={{fontFamily:FS.serif,fontSize:17,fontWeight:600,color:C.text,marginBottom:12}}>Popular questions</div>
        {["What are the signs of red mite infestation?","How long does a moult usually last?","Should I separate a broody hen?","What's the best natural worming approach?"].map(qq=><button key={qq} onClick={()=>{qRef.current=qq;const el=document.getElementById("ai-question");if(el)el.value=qq;}} style={{display:"block",width:"100%",textAlign:"left",background:C.bgMuted,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 13px",marginBottom:8,fontFamily:FS.sans,fontSize:13,color:C.text,cursor:"pointer",lineHeight:1.4}}>{qq} →</button>)}
      </WCard>
    </>}
  </div>;
}

// ── ROOT ──────────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("care");
  const [hens,setHens]=useState([]);
  const [memHens,setMemHens]=useState([]);
  const [tasks,setTasks]=useState({});
  const [activeHen,setActiveHen]=useState(null);
  const NAV=[
    {k:"care",l:"CARE",icon:(a)=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?C.green:C.textMuted} strokeWidth="1.5" strokeLinecap="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>},
    {k:"flock",l:"FLOCK",icon:(a)=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?C.green:C.textMuted} strokeWidth="1.5" strokeLinecap="round"><circle cx="9" cy="7" r="3"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg>},
    {k:"health",l:"HEALTH",icon:(a)=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?C.green:C.textMuted} strokeWidth="1.5" strokeLinecap="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg>},
    {k:"vets",l:"VETS",icon:(a)=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?C.green:C.textMuted} strokeWidth="1.5" strokeLinecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>},
    {k:"community",l:"CONNECT",icon:(a)=><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={a?C.green:C.textMuted} strokeWidth="1.5" strokeLinecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>},
  ];
  return <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
    <Header hens={hens} tasks={tasks}/>
    {tab==="flock"&&activeHen&&<div style={{background:C.bgCard,borderBottom:`1px solid ${C.borderLight}`,padding:"10px 20px",display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
      <button onClick={()=>setActiveHen(null)} style={{background:"none",border:"none",color:C.textMid,fontFamily:FS.sans,fontSize:13,cursor:"pointer",padding:0,display:"flex",alignItems:"center",gap:5}}>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><polyline points="9,2 4,7 9,12" stroke={C.textMid} strokeWidth="1.5" strokeLinecap="round"/></svg>Flock
      </button>
      <span style={{color:C.border}}>/</span>
      <span style={{fontFamily:FS.sans,fontSize:13,color:C.text,fontWeight:500}}>{activeHen.name}</span>
    </div>}
    <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
      <div style={{maxWidth:560,margin:"0 auto",padding:"18px 18px 20px"}}>
        {tab==="care"&&<CareTab hens={hens} tasks={tasks} setTasks={setTasks}/>}
        {tab==="flock"&&(activeHen?<HenProfile hen={activeHen} onBack={()=>setActiveHen(null)}/>:<FlockTab hens={hens} setHens={setHens} memHens={memHens} setMemHens={setMemHens} setActiveHen={setActiveHen}/>)}
        {tab==="health"&&<HealthMainTab/>}
        {tab==="vets"&&<VetsTab/>}
        {tab==="community"&&<CommTab/>}
      </div>
    </div>
    <div style={{background:C.bgCard,borderTop:`1px solid ${C.borderLight}`,flexShrink:0,paddingBottom:"env(safe-area-inset-bottom)"}}>
      <div style={{maxWidth:560,margin:"0 auto",display:"flex"}}>
        {NAV.map(n=>{const active=tab===n.k;return <button key={n.k} onClick={()=>{setTab(n.k);if(n.k!=="flock")setActiveHen(null);}} style={{flex:1,background:"none",border:"none",padding:"10px 0 12px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
          {active&&<div style={{width:5,height:5,borderRadius:"50%",background:C.green,marginBottom:1}}/>}
          {n.icon(active)}
          <span style={{fontFamily:FS.sans,fontSize:9,color:active?C.green:C.textMuted,fontWeight:active?600:400,letterSpacing:"0.07em"}}>{n.l}</span>
        </button>;})}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
