function StatusPill({label,type="ok"}){

}

function HenAvatar({hen,size=44}){
  if(hen.photo){
    const scale=hen.photoScale||1;
    const ox=hen.photoOffsetX||0;
    const oy=hen.photoOffsetY||0;
    return <div style={{width:size,height:size,borderRadius:size/3,overflow:"hidden",border:`2px solid ${hen.color}55`,flexShrink:0,position:"relative"}}>
      <img src={hen.photo} alt={hen.name} style={{position:"absolute",width:`${scale*100}%`,height:`${scale*100}%`,objectFit:"cover",left:`${50+ox}%`,top:`${50+oy}%`,transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>
    </div>;
  }
  return <div style={{width:size,height:size,borderRadius:size/3,background:hen.color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.48,border:`1.5px solid ${hen.color}44`,flexShrink:0}}>{hen.emoji||"🐓"}</div>;
}

// ─── PHOTO CROP EDITOR ───────────────────────────────────────────────────────
function PhotoCropEditor({src,scale,offsetX,offsetY,onScale,onOffset,onReset,onConfirm}){
  const containerRef=useRef();
  const dragging=useRef(false);
  const lastPos=useRef({x:0,y:0});

  const onMouseDown=e=>{dragging.current=true;lastPos.current={x:e.clientX,y:e.clientY};e.preventDefault();};
  const onMouseMove=e=>{
    if(!dragging.current)return;
    const dx=((e.clientX-lastPos.current.x)/120)*10;
    const dy=((e.clientY-lastPos.current.y)/120)*10;
    lastPos.current={x:e.clientX,y:e.clientY};
    onOffset(ox=>Math.max(-40,Math.min(40,ox+dx)),oy=>Math.max(-40,Math.min(40,oy+dy)));
  };
  const onMouseUp=()=>{dragging.current=false;};
  const onTouchStart=e=>{dragging.current=true;lastPos.current={x:e.touches[0].clientX,y:e.touches[0].clientY};};
  const onTouchMove=e=>{
    if(!dragging.current)return;
    const dx=((e.touches[0].clientX-lastPos.current.x)/120)*10;
    const dy=((e.touches[0].clientY-lastPos.current.y)/120)*10;
    lastPos.current={x:e.touches[0].clientX,y:e.touches[0].clientY};
    onOffset(ox=>Math.max(-40,Math.min(40,ox+dx)),oy=>Math.max(-40,Math.min(40,oy+dy)));
    e.preventDefault();
  };

  return <div style={{background:C.bgMuted,borderRadius:16,padding:"18px",border:`1px solid ${C.border}`,marginBottom:14}}>
    <div style={{fontFamily:GS.fontSans,fontWeight:600,fontSize:13,color:C.text,marginBottom:4}}>Adjust your photo</div>
    <div style={{fontFamily:GS.fontSans,fontSize:12,color:C.textMuted,marginBottom:14,lineHeight:1.5}}>Drag to move · use slider to zoom · tap Reset to start again</div>

    {/* Circle preview — drag to pan */}
    <div style={{display:"flex",justifyContent:"center",marginBottom:18}}>
      <div
        ref={containerRef}
        onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={()=>{dragging.current=false;}}
        style={{width:120,height:120,borderRadius:24,overflow:"hidden",border:`3px solid ${C.green}`,cursor:"grab",position:"relative",touchAction:"none",userSelect:"none",flexShrink:0}}>
        <img src={src} alt="preview" style={{position:"absolute",width:`${scale*100}%`,height:`${scale*100}%`,objectFit:"cover",left:`${50+offsetX}%`,top:`${50+offsetY}%`,transform:"translate(-50%,-50%)",pointerEvents:"none"}}/>
        {/* Grid overlay */}
        <div style={{position:"absolute",inset:0,backgroundImage:`linear-gradient(${C.green}22 1px,transparent 1px),linear-gradient(90deg,${C.green}22 1px,transparent 1px)`,backgroundSize:"40px 40px",pointerEvents:"none"}}/>
      </div>
    </div>

    {/* Zoom slider */}
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
        <span style={{fontFamily:GS.fontSans,fontSize:11,color:C.textMuted}}>Zoom</span>
        <span style={{fontFamily:GS.fontSans,fontSize:11,color:C.textMuted}}>{Math.round(scale*100)}%</span>
      </div>
      <input type="range" min="50" max="200" step="1" value={scale*100}
        onChange={e=>onScale(Number(e.target.value)/100)}
        style={{width:"100%",accentColor:C.green,cursor:"pointer"}}/>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
        <span style={{fontFamily:GS.fontSans,fontSize:10,color:C.textMuted}}>Zoom out</span>
        <span style={{fontFamily:GS.fontSans,fontSize:10,color:C.textMuted}}>Zoom in</span>
      </div>
    </div>

    {/* Controls */}
    <div style={{display:"flex",gap:9}}>
      <button onClick={onConfirm} style={{flex:1,background:C.green,color:"#fff",border:"none",borderRadius:10,padding:"10px 0",fontFamily:GS.fontSans,fontSize:13,cursor:"pointer",fontWeight:500}}>Use this photo ✓</button>
      <button onClick={onReset} style={{background:C.bgCard,color:C.textMid,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",fontFamily:GS.fontSans,fontSize:13,cursor:"pointer"}}>Reset</button>
    </div>
  </div>;
}

// ─── WELFARE CONDITIONS (persistent per-hen) ─────────────────────────────────
const WELFARE_CONDITIONS = [
  { id:"bumblefoot",     label:"Bumblefoot",              options:["No signs","Mild swelling","Open wound / severe"],    icon:"🦶" },
  { id:"comb",           label:"Comb condition",          options:["Red & upright","Pale / drooping","Purple or scabby"], icon:"🌹" },
  { id:"abdomen",        label:"Abdomen",                 options:["Soft & normal","Slightly distended","Hard / fluid"],  icon:"🫃" },
  { id:"lice_mites",     label:"Lice / mites",            options:["Clear","Some signs","Active infestation"],           icon:"🔬" },
  { id:"feather_loss",   label:"Feather loss",            options:["None","Mild patching","Significant loss"],           icon:"🪶" },
  { id:"worms",          label:"Worm burden",             options:["Not suspected","Suspected","Confirmed / treating"],  icon:"🪱" },
  { id:"tumour",         label:"Lumps / tumours",         options:["None felt","Possible lump","Confirmed / monitored"], icon:"⚠️" },
  { id:"respiratory",    label:"Respiratory signs",       options:["Clear","Occasional wheeze","Persistent / laboured"], icon:"💨" },
  { id:"eye_discharge",  label:"Eye discharge",           options:["Clear","Mild","Significant / swollen"],             icon:"👁️" },
  { id:"mobility",       label:"Mobility",                options:["Normal","Slight limp","Lame / can't weight-bear"],   icon:"🚶" },
];

const WELFARE_OPTION_COLORS = ["ok","warn","alert"];

// ─── HEN FORM (Add / Edit) ───────────────────────────────────────────────────
// KEY FIX: All text inputs use local controlled refs so the keyboard
// never dismisses mid-typing. We only merge into form state on blur.

function HenForm({initial,onSave,onCancel,onDelete,onMemorial}){
  // Split out text fields into separate local state to prevent keyboard dismissal
  const [name, setName] = useState(initial?.name || "");
  const [age,  setAge]  = useState(initial?.age  || "");
  const [notes,setNotes]= useState(initial?.notes|| "");
  const [memNote, setMemNote] = useState("");
  const [memDate, setMemDate] = useState("");

  const [form, setForm] = useState({
    ...(initial || {...EMPTY_HEN}),
    meds: initial?.meds || [],
    welfare: initial?.welfare || {},
  });

  const [rawPhoto,      setRawPhoto]      = useState(initial?.photo || null);
  const [editingPhoto,  setEditingPhoto]  = useState(false);
  const [cropScale,     setCropScale]     = useState(initial?.photoScale    || 1);
  const [cropX,         setCropX]         = useState(initial?.photoOffsetX  || 0);
  const [cropY,         setCropY]         = useState(initial?.photoOffsetY  || 0);
  const [showMemorial,  setShowMemorial]  = useState(false);
  const [detectingBreed,setDetectingBreed]= useState(false);
  const [breedSuggestion,setBreedSugg]   = useState(null);
  const [newMed,        setNewMed]        = useState("");
  const [medEnd,        setMedEnd]        = useState("");
  const photoRef = useRef();

  const handleFile = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      setRawPhoto(ev.target.result);
      setCropScale(1); setCropX(0); setCropY(0);
      setEditingPhoto(true);
      setBreedSugg(null);
    };
    reader.readAsDataURL(file);
  };

  const confirmCrop = async () => {
    setForm(f => ({...f, photo:rawPhoto, photoScale:cropScale, photoOffsetX:cropX, photoOffsetY:cropY}));
    setEditingPhoto(false);
    // Auto-detect breed from photo
    setDetectingBreed(true);
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514", max_tokens:400,
          messages:[{ role:"user", content:[
            { type:"image", source:{type:"base64", media_type:"image/jpeg", data: rawPhoto.split(",")[1] || rawPhoto }},
            { type:"text",  text:`You are an expert in UK chicken breeds. Look at this photo and identify the most likely breed. Respond with ONLY a JSON object like: {"breed":"Rhode Island Red","confidence":"high","alternatives":["Warren","ISA Brown"],"notes":"Typical reddish-brown plumage and single comb"}. Confidence should be high/medium/low. If you cannot determine the breed from the photo, return {"breed":"Unknown","confidence":"low","alternatives":[],"notes":"Photo not clear enough to identify breed"}. Return ONLY the JSON, no other text.`}
          ]}]
        })
      });
      const d = await res.json();
      const text = d.content?.map(b=>b.text||"").join("").trim();
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      setBreedSugg(parsed);
      if (parsed.breed && parsed.breed !== "Unknown" && parsed.confidence !== "low") {
        setForm(f => ({...f, breed: parsed.breed}));
      }
    } catch(e) {
      setBreedSugg({breed:"Unknown", confidence:"low", alternatives:[], notes:"Could not analyse photo"});
    }
    setDetectingBreed(false);
  };

  const resetPhoto = () => { setRawPhoto(null); setForm(f=>({...f,photo:null})); setEditingPhoto(false); setBreedSugg(null); };

  const addMed = () => {
    if (!newMed.trim()) return;
    const entry = newMed + (medEnd ? ` (until ${medEnd})` : "");
    setForm(f => ({...f, meds:[...f.meds, entry]}));
    setNewMed(""); setMedEnd("");
  };
  const removeMed = idx => setForm(f => ({...f, meds:f.meds.filter((_,i)=>i!==idx)}));

  const setWelfare = (id, val) => setForm(f => ({...f, welfare:{...f.welfare,[id]:val}}));

  const buildFinalForm = () => ({
    ...form,
    name: name.trim(),
    age:  age.trim(),
    notes: notes.trim(),
    photoScale: cropScale,
    photoOffsetX: cropX,
    photoOffsetY: cropY,
  });

  const valid = name.trim().length > 0;

  const iStyle = {
    width:"100%", padding:"10px 13px", borderRadius:9,
    border:`1px solid ${C.border}`, fontFamily:GS.fontSans,
    fontSize:13, color:C.text, background:C.bgMuted,
    outline:"none", boxSizing:"border-box",
  };
  const F = ({label, children}) => (
    <div style={{marginBottom:16}}>
      <div style={{fontFamily:GS.fontSans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:7}}>{label}</div>
      {children}
    </div>
  );

  // ── Memorial screen ───────────────────────────────────────────────────────
  if (showMemorial) return (
    <div>
      <div style={{fontFamily:GS.fontSerif,fontSize:22,fontWeight:600,color:C.text,marginBottom:6}}>🕊️ In Memory of {name||initial?.name}</div>
      <div style={{fontFamily:GS.fontSans,fontSize:13,color:C.textMid,lineHeight:1.65,marginBottom:20}}>She will be moved to your memorial archive. Her diary, photos and records will be preserved forever.</div>
      <F label="Date she passed">
        <input type="date" value={memDate} onChange={e=>setMemDate(e.target.value)} style={iStyle}/>
      </F>
      <F label="A note to remember her (optional)">
        <textarea value={memNote} onChange={e=>setMemNote(e.target.value)}
          placeholder={`e.g. ${name||"She"} was the boldest of the flock, always first to the feeder…`}
          style={{...iStyle, minHeight:90, resize:"vertical", lineHeight:1.6}}/>
      </F>
      <div style={{display:"flex",gap:9}}>
        <button onClick={()=>onMemorial({...buildFinalForm(),passedDate:memDate,memorialNote:memNote})}
          style={{flex:1,background:"#7A5E9A",color:"#fff",border:"none",borderRadius:11,padding:"12px 0",fontFamily:GS.fontSans,fontSize:13,cursor:"pointer",fontWeight:500}}>
          🕊️ Move to Memorial
        </button>
        <button onClick={()=>setShowMemorial(false)} style={{background:C.bgMuted,color:C.textMid,border:`1px solid ${C.border}`,borderRadius:11,padding:"12px 14px",fontFamily:GS.fontSans,fontSize:13,cursor:"pointer"}}>Cancel</button>
      </div>
    </div>
  );

  // ── Main form ─────────────────────────────────────────────────────────────
  return (
    <div>
      <div style={{fontFamily:GS.fontSerif,fontSize:22,fontWeight:600,color:C.text,marginBottom:20}}>
        {initial ? `Edit ${initial.name}` : "Add a Hen"}
      </div>

      {/* ── PHOTO ── */}
      <F label="Photo">
        {editingPhoto && rawPhoto
          ? <PhotoCropEditor src={rawPhoto} scale={cropScale} offsetX={cropX} offsetY={cropY}
              onScale={s=>setCropScale(s)}
              onOffset={(fx,fy)=>{setCropX(p=>typeof fx==="function"?fx(p):fx);setCropY(p=>typeof fy==="function"?fy(p):fy);}}
              onReset={resetPhoto} onConfirm={confirmCrop}/>
          : <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:4}}>
              <div onClick={()=>photoRef.current.click()} style={{width:76,height:76,borderRadius:18,overflow:"hidden",border:`2px dashed ${C.border}`,background:C.bgMuted,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,position:"relative"}}>
                {form.photo ? <HenAvatar hen={form} size={76}/> : <div style={{textAlign:"center"}}><div style={{fontSize:28}}>{form.emoji}</div><div style={{fontFamily:GS.fontSans,fontSize:10,color:C.textMuted,marginTop:3}}>Tap to add</div></div>}
                <div style={{position:"absolute",bottom:0,right:0,width:22,height:22,borderRadius:"50%",background:C.green,display:"flex",alignItems:"center",justifyContent:"center",border:"2px solid #fff"}}>
                  <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M8.5 1.5L10.5 3.5L4 10H2V8L8.5 1.5Z" stroke="#fff" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </div>
              </div>
              <div>
                <div style={{fontFamily:GS.fontSans,fontSize:13,color:C.text,fontWeight:500,marginBottom:3}}>Upload a photo of your hen</div>
                <div style={{fontFamily:GS.fontSans,fontSize:12,color:C.textMuted,lineHeight:1.5}}>AI will suggest her breed automatically</div>
                {form.photo && <>
                  <button onClick={()=>setEditingPhoto(true)} style={{background:"none",border:"none",color:C.blue,fontFamily:GS.fontSans,fontSize:12,cursor:"pointer",padding:"4px 0 0 0",display:"block"}}>Re-adjust photo</button>
                  <button onClick={resetPhoto} style={{background:"none",border:"none",color:C.red,fontFamily:GS.fontSans,fontSize:12,cursor:"pointer",padding:"2px 0 0 0",display:"block"}}>Remove photo</button>
                </>}
              </div>
            </div>}
        <input ref={photoRef} type="file" accept="image/*" onChange={handleFile} style={{display:"none"}}/>
      </F>

      {/* ── AI BREED SUGGESTION ── */}
      {detectingBreed && (
        <div style={{background:C.goldLight,border:`1px solid ${C.goldBorder}`,borderRadius:12,padding:"12px 14px",marginBottom:16,fontFamily:GS.fontSans,fontSize:13,color:C.textMid,display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:18}}>🔍</span> Identifying breed from photo…
        </div>
      )}
      {breedSuggestion && !detectingBreed && (
        <div style={{background:C.greenLight,border:`1px solid ${C.green}44`,borderRadius:12,padding:"13px 15px",marginBottom:16}}>
          <div style={{fontFamily:GS.fontSans,fontWeight:600,fontSize:13,color:C.green,marginBottom:5}}>
            ✨ AI thinks she might be: <strong>{breedSuggestion.breed}</strong>
            <span style={{fontWeight:400,color:C.textMuted,marginLeft:6}}>({breedSuggestion.confidence} confidence)</span>
          </div>
          {breedSuggestion.notes && <div style={{fontFamily:GS.fontSans,fontSize:12,color:C.textMid,marginBottom:8}}>{breedSuggestion.notes}</div>}
          {breedSuggestion.alternatives?.length > 0 && (
            <div style={{fontFamily:GS.fontSans,fontSize:12,color:C.textMid,marginBottom:10}}>
              Other possibilities: {breedSuggestion.alternatives.join(", ")}
            </div>
          )}
          <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
            <button onClick={()=>setForm(f=>({...f,breed:breedSuggestion.breed}))}
              style={{background:C.green,color:"#fff",border:"none",borderRadius:8,padding:"6px 12px",fontFamily:GS.fontSans,fontSize:12,cursor:"pointer",fontWeight:500}}>
              ✓ Use {breedSuggestion.breed}
            </button>
            {breedSuggestion.alternatives?.map(a=>(
              <button key={a} onClick={()=>setForm(f=>({...f,breed:a}))}
                style={{background:C.bgCard,color:C.text,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 12px",fontFamily:GS.fontSans,fontSize:12,cursor:"pointer"}}>
                {a}
              </button>
            ))}
          </div>
          <button onClick={()=>setBreedSugg(null)} style={{background:"none",border:"none",color:C.textMuted,fontFamily:GS.fontSans,fontSize:11,cursor:"pointer",padding:"6px 0 0 0",display:"block"}}>
            Dismiss — I'll choose manually
          </button>
        </div>
      )}

      {/* ── NAME ── */}
      <F label="Name *">
        <input
          value={name}
          onChange={e => setName(e.target.value)}
          placeholder="e.g. Margot"
          autoComplete="off"
          style={iStyle}
        />
      </F>

      {/* ── BREED ── */}
      <F label="Breed">
        <select value={form.breed} onChange={e=>setForm(f=>({...f,breed:e.target.value}))} style={{...iStyle,appearance:"none"}}>
          <option value="">Select breed…</option>
          {BREEDS.map(b=><option key={b} value={b}>{b}</option>)}
        </select>
        {form.breed && <div style={{fontFamily:GS.fontSans,fontSize:11,color:C.green,marginTop:4}}>✓ {form.breed} selected</div>}
      </F>

      {/* ── AGE / DOB ── */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
        <div>
          <div style={{fontFamily:GS.fontSans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:7}}>Age</div>
          <input value={age} onChange={e=>setAge(e.target.value)} placeholder="e.g. 2 yrs" autoComplete="off" style={iStyle}/>
        </div>
        <div>
          <div style={{fontFamily:GS.fontSans,fontSize:11,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:7}}>Date of birth</div>
          <input type="date" value={form.dob} onChange={e=>setForm(f=>({...f,dob:e.target.value}))} style={iStyle}/>
        </div>
      </div>

      {/* ── EMOJI (if no photo) ── */}
      {!form.photo && <F label="Icon (if no photo)">
        <div style={{display:"flex",gap:8}}>{HEN_EMOJIS.map(e=><button key={e} onClick={()=>setForm(f=>({...f,emoji:e}))} style={{width:44,height:44,borderRadius:11,border:`2px solid ${form.emoji===e?C.green:C.border}`,background:form.emoji===e?C.greenLight:C.bgMuted,fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{e}</button>)}</div>
      </F>}

      {/* ── COLOUR ── */}
      <F label="Colour accent">
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{HEN_COLORS.map(col=><button key={col} onClick={()=>setForm(f=>({...f,color:col}))} style={{width:30,height:30,borderRadius:"50%",background:col,border:`3px solid ${form.color===col?C.text:"transparent"}`,cursor:"pointer",outline:"none"}}/>)}</div>
      </F>

      {/* ── LAYING ── */}
      <F label="Currently laying?">
        <div style={{display:"flex",gap:8}}>{[{v:true,l:"Yes — in lay 🥚"},{v:false,l:"Not in lay"}].map(opt=><button key={String(opt.v)} onClick={()=>setForm(f=>({...f,inLay:opt.v}))} style={{flex:1,background:form.inLay===opt.v?C.green:C.bgMuted,color:form.inLay===opt.v?"#fff":C.text,border:`1px solid ${form.inLay===opt.v?C.green:C.border}`,borderRadius:10,padding:"9px 0",fontFamily:GS.fontSans,fontSize:13,cursor:"pointer",fontWeight:form.inLay===opt.v?500:400}}>{opt.l}</button>)}</div>
      </F>

      {/* ── MEDICATIONS ── */}
      <F label="Medications & Treatments">
        {form.meds.length > 0 && (
          <div style={{marginBottom:10}}>
            {form.meds.map((med,i) => (
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,background:C.blueLight,border:`1px solid ${C.blue}33`,borderRadius:9,padding:"8px 12px",marginBottom:6}}>
                <span style={{fontSize:16}}>💊</span>
                <span style={{flex:1,fontFamily:GS.fontSans,fontSize:12.5,color:C.text}}>{med}</span>
                <button onClick={()=>removeMed(i)} style={{background:"none",border:"none",color:C.red,fontSize:16,cursor:"pointer",padding:"0 2px",lineHeight:1}}>×</button>
              </div>
            ))}
          </div>
        )}
        <div style={{display:"flex",flexDirection:"column",gap:7}}>
          <input
            value={newMed}
            onChange={e=>setNewMed(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&addMed()}
            placeholder="e.g. Flubenvet, Ivermectin, Tylan…"
            autoComplete="off"
            style={iStyle}
          />
          <div style={{display:"flex",gap:7}}>
            <input type="date" value={medEnd} onChange={e=>setMedEnd(e.target.value)} style={{...iStyle,flex:1}} placeholder="End date (optional)"/>
            <button onClick={addMed} disabled={!newMed.trim()} style={{background:newMed.trim()?C.blue:C.border,color:"#fff",border:"none",borderRadius:9,padding:"10px 14px",fontFamily:GS.fontSans,fontSize:13,cursor:newMed.trim()?"pointer":"default",fontWeight:500,whiteSpace:"nowrap"}}>+ Add</button>
          </div>
        </div>
      </F>

      {/* ── WELFARE CONDITIONS ── */}
      <F label="Welfare & Health Conditions">
        <div style={{fontFamily:GS.fontSans,fontSize:12,color:C.textMuted,marginBottom:10,lineHeight:1.5}}>
          Set her current baseline — this stays on her profile and updates over time.
        </div>
        {WELFARE_CONDITIONS.map(cond => {
          const val = form.welfare?.[cond.id] || 0;
          const optColors = [C.greenLight, C.amberLight, C.redLight];
          const optTextColors = [C.green, C.amber, C.red];
          return (
            <div key={cond.id} style={{marginBottom:14,paddingBottom:14,borderBottom:`1px solid ${C.borderLight}`}}>
              <div style={{fontFamily:GS.fontSans,fontSize:12.5,color:C.text,fontWeight:500,marginBottom:7}}>{cond.icon} {cond.label}</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {cond.options.map((opt,idx) => (
                  <button key={opt} onClick={()=>setWelfare(cond.id, idx)}
                    style={{
                      background: val===idx ? optColors[idx] : C.bgMuted,
                      color: val===idx ? optTextColors[idx] : C.textMid,
                      border:`1.5px solid ${val===idx ? optTextColors[idx]+"55" : C.border}`,
                      borderRadius:8, padding:"6px 11px",
                      fontFamily:GS.fontSans, fontSize:11.5, cursor:"pointer",
                      fontWeight: val===idx ? 600 : 400,
                      transition:"all 0.15s",
                    }}>
                    {idx===0?"✅ ":idx===1?"⚠️ ":"🚨 "}{opt}
                  </button>
                ))}
              </div>
            </div>
          );
        })}
      </F>

      {/* ── NOTES ── */}
      <F label="Notes (optional)">
        <textarea
          value={notes}
          onChange={e=>setNotes(e.target.value)}
          placeholder="e.g. rehomed March 2025, nervous around handling, loves sunflower seeds…"
          style={{...iStyle, minHeight:80, resize:"vertical", lineHeight:1.6}}
        />
      </F>

      {/* ── SAVE / CANCEL ── */}
      <div style={{display:"flex",gap:9,marginTop:4}}>
        <button onClick={()=>valid&&onSave(buildFinalForm())}
          style={{flex:1,background:valid?C.green:C.border,color:"#fff",border:"none",borderRadius:11,padding:"13px 0",fontFamily:GS.fontSans,fontSize:14,cursor:valid?"pointer":"default",fontWeight:500}}>
          {initial?"Save Changes":"Add to Flock ✓"}
        </button>
        <button onClick={onCancel} style={{background:C.bgMuted,color:C.textMid,border:`1px solid ${C.border}`,borderRadius:11,padding:"13px 16px",fontFamily:GS.fontSans,fontSize:14,cursor:"pointer"}}>Cancel</button>
      </div>

      {/* ── MEMORIAL / DELETE ── */}
      {initial && <>
        {onMemorial && <button onClick={()=>setShowMemorial(true)}
          style={{width:"100%",marginTop:10,background:"#F5F0FB",color:"#7A5E9A",border:"1px solid #C4A8D844",borderRadius:11,padding:"11px 0",fontFamily:GS.fontSans,fontSize:13,cursor:"pointer"}}>
          🕊️ {initial.name} has passed away…
        </button>}
        {onDelete && <button onClick={onDelete}
          style={{width:"100%",marginTop:8,background:"none",border:`1px solid ${C.red}44`,color:C.red,borderRadius:11,padding:"11px 0",fontFamily:GS.fontSans,fontSize:13,cursor:"pointer"}}>
          Remove {initial.name} from flock
        </button>}
      </>}
    </div>
  );
}

// ─── APP HEADER ───────────────────────────────────────────────────────────────
function AppHeader({hens,flockTasks}){
  const done=Object.values(flockTasks).filter(Boolean).length;
  const eggsToday=hens.reduce((a,h)=>a+(h.eggsToday||0),0);
  const eggsWeek=EGG_COUNTS.reduce((a,b)=>a+b,0);
  return <div style={{background:C.headerBg,padding:"22px 20px 18px"}}>
    <div style={{display:"flex",alignItems:"center",gap:13,marginBottom:16}}>
      <div style={{width:46,height:46,borderRadius:14,background:"rgba(255,255,255,0.11)",display:"flex",alignItems:"center",justifyContent:"center",border:"1px solid rgba(255,255,255,0.14)"}}><FeatherIcon size={26} color="#B89A6A"/></div>
      <div>
        <div style={{fontFamily:GS.fontSerif,fontSize:26,fontWeight:600,color:"#F5F0E8",letterSpacing:"0.01em",lineHeight:1}}>Flock & Feather</div>
        <div style={{fontFamily:GS.fontSans,fontSize:10,color:"rgba(255,255,255,0.45)",letterSpacing:"0.2em",textTransform:"uppercase",marginTop:3}}>Hen Welfare Tracker</div>
      </div>
    </div>
    <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
      {[`${hens.length} hens`,`${eggsToday} today`,`${eggsWeek} this week`,`${done}/${CARE_TASKS.length} tasks`].map(l=><div key={l} style={{border:"1px solid rgba(255,255,255,0.2)",borderRadius:20,padding:"5px 12px",fontFamily:GS.fontSans,fontSize:12,color:"rgba(255,255,255,0.8)",background:"rgba(255,255,255,0.07)"}}>{l}</div>)}

// ─── TAB 1: CARE ─────────────────────────────────────────────────────────────

  const allMeds=hens.flatMap(h=>h.meds.map(m=>({hen:h,med:m})));
  const eggsToday=hens.reduce((a,h)=>a+(h.eggsToday||0),0);

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:18}}>
      <GreenCard style={{padding:"16px 18px"}}>
        <div style={{fontFamily:GS.fontSans,fontSize:11,color:"rgba(255,255,255,0.5)",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:4}}>Eggs today</div>
        <div style={{fontFamily:GS.fontSerif,fontSize:38,fontWeight:600,color:"#fff",lineHeight:1}}>{eggsToday}</div>
        <div style={{fontFamily:GS.fontSans,fontSize:11,color:"rgba(255,255,255,0.5)",marginTop:5}}>of {hens.filter(h=>h.inLay).length} laying hens</div>

// ─── TAB 2: FLOCK ────────────────────────────────────────────────────────────
function FlockTab({hens,setHens,memorialHens,setMemorialHens,setActiveHen}){
  const [mode,setMode]=useState("list");
  const [editingHen,setEditingHen]=useState(null);

  const addHen=form=>{setHens(p=>[...p,{...form,id:Date.now(),meds:[],alerts:[],eggsToday:0}]);setMode("list");};
  const saveHen=form=>{setHens(p=>p.map(h=>h.id===editingHen.id?{...h,...form}:h));setMode("list");setEditingHen(null);};
  const deleteHen=()=>{setHens(p=>p.filter(h=>h.id!==editingHen.id));setMode("list");setEditingHen(null);};
  const memorialHen=form=>{
    setMemorialHens(p=>[...p,{...form,id:form.id||editingHen.id,archivedAt:new Date().toLocaleDateString("en-GB")}]);
    setHens(p=>p.filter(h=>h.id!==editingHen.id));
    setMode("list");setEditingHen(null);
  };

  if(mode==="add") return <HenForm onSave={addHen} onCancel={()=>setMode("list")}/>;

        </div>)}

      <WhiteCard style={{marginBottom:18}}>
        <div style={{fontFamily:GS.fontSerif,fontSize:16,fontWeight:600,color:C.text,marginBottom:14}}>7-Day Egg Trend</div>
        <div style={{display:"flex",gap:5,alignItems:"flex-end",height:56}}>
          {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((day,i)=><div key={day} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:5}}>
            <div style={{width:"100%",background:EGG_COUNTS[i]>0?C.green:C.borderLight,borderRadius:5,height:`${Math.max(EGG_COUNTS[i]*15,4)}px`}}/>

      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:8}}>
        {memorialHens.map(h=><div key={h.id} style={{background:"#FAF7FC",border:"1px solid #E0D4EE",borderRadius:16,padding:"14px 16px",display:"flex",alignItems:"center",gap:13}}>
          <div style={{position:"relative"}}>
            <HenAvatar hen={{...h,color:h.color+"88"}} size={48}/>

// ─── HEN PROFILE ─────────────────────────────────────────────────────────────

  const optColors = [C.greenLight, C.amberLight, C.redLight];
  const optText   = [C.green,      C.amber,      C.red];
  const concerns  = WELFARE_CONDITIONS.filter(c => (welfare[c.id]||0) > 0);
  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {concerns.length === 0 && (
        <div style={{background:C.greenLight,border:`1px solid ${C.green}33`,borderRadius:14,padding:"16px 18px",textAlign:"center"}}>
          <div style={{fontSize:28,marginBottom:6}}>✅</div>
          <div style={{fontFamily:GS.fontSerif,fontSize:16,fontWeight:600,color:C.green}}>No active welfare concerns</div>
          <div style={{fontFamily:GS.fontSans,fontSize:12,color:C.textMid,marginTop:4}}>All conditions set to normal. Edit her profile to update.</div>

            const level = welfare[c.id]||0;

              <span style={{fontSize:18,flexShrink:0}}>{c.icon}</span>
              <div style={{flex:1}}>
                <div style={{fontFamily:GS.fontSans,fontSize:13,color:C.text,fontWeight:500}}>{c.label}</div>
                <div style={{fontFamily:GS.fontSans,fontSize:12,color:optText[level]}}>{level===1?"⚠️ ":"🚨 "}{c.options[level]}</div>
              </div>

          })}

      )}

      <WhiteCard>
        <div style={{fontFamily:GS.fontSerif,fontSize:17,fontWeight:600,color:C.text,marginBottom:14}}>Full Welfare Profile</div>
        {WELFARE_CONDITIONS.map((cond,i)=>{
          const val = welfare[cond.id]||0;

            <div key={cond.id} style={{paddingBottom:i<WELFARE_CONDITIONS.length-1?12:0,marginBottom:i<WELFARE_CONDITIONS.length-1?12:0,borderBottom:i<WELFARE_CONDITIONS.length-1?`1px solid ${C.borderLight}`:"none"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
                <span style={{fontSize:16}}>{cond.icon}</span>
                <span style={{fontFamily:GS.fontSans,fontSize:13,fontWeight:500,color:C.text}}>{cond.label}</span>

              <div style={{display:"inline-block",background:optColors[val],border:`1px solid ${optText[val]}44`,borderRadius:8,padding:"4px 10px",fontFamily:GS.fontSans,fontSize:12,color:optText[val],fontWeight:500}}>
                {val===0?"✅ ":val===1?"⚠️ ":"🚨 "}{cond.options[val]}

        <div style={{marginTop:14,fontFamily:GS.fontSans,fontSize:12,color:C.textMuted}}>

      {/* Meds on welfare view */}
      {hen.meds?.length > 0 && (
        <WhiteCard>
          <div style={{fontFamily:GS.fontSerif,fontSize:17,fontWeight:600,color:C.text,marginBottom:12}}>💊 Current Medications</div>
          {hen.meds.map((med,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,paddingBottom:i<hen.meds.length-1?10:0,marginBottom:i<hen.meds.length-1?10:0,borderBottom:i<hen.meds.length-1?`1px solid ${C.borderLight}`:"none"}}>
              <span style={{fontSize:18}}>💊</span>
              <span style={{fontFamily:GS.fontSans,fontSize:13,color:C.text}}>{med}</span>
            </div>
          ))}
        </WhiteCard>
      )}

      {hen.notes && (
        <WhiteCard>
          <div style={{fontFamily:GS.fontSerif,fontSize:17,fontWeight:600,color:C.text,marginBottom:8}}>📝 Notes</div>
          <div style={{fontFamily:GS.fontSans,fontSize:13,color:C.textMid,lineHeight:1.7}}>{hen.notes}</div>
        </WhiteCard>
      )}
    </div>
  );
}

// ─── HEALTH LOG ───────────────────────────────────────────────────────────────
function HealthLogTab({hen}){
  const [markers,setMarkers]=useState({});
  const [inLay,setInLay]=useState(null);
  const [text,setText]=useState("");
  const [loading,setLoading]=useState(false);
  const [summary,setSummary]=useState("");
  const [notes,setNotes]=useState([]);
  const [saved,setSaved]=useState(false);
  const summarise=async()=>{
    if(!text.trim())return;setLoading(true);
    try{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`You are a pet hen welfare assistant. Summarise this keeper observation into a clean diary entry (3–5 bullet points). Flag concerns with ⚠️, suggest vet if needed. Do not diagnose.\n\nHen: ${hen.name} (${hen.breed||"unknown breed"})\nNote: "${text}"`}]})});const d=await res.json();setSummary(d.content?.map(b=>b.text||"").join("")||"Could not summarise.");}
    catch{setSummary("Error.");}setLoading(false);
  };
  const save=()=>{setNotes(n=>[{text:summary||text,date:new Date().toLocaleDateString("en-GB")},...n]);setSaved(true);setSummary("");setText("");setTimeout(()=>setSaved(false),2500);};
  const inputStyle={width:"100%",padding:"10px 13px",borderRadius:9,border:`1px solid ${C.border}`,fontFamily:GS.fontSans,fontSize:13,color:C.text,background:C.bgMuted,outline:"none",boxSizing:"border-box"};
  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    <WhiteCard>
      <div style={{fontFamily:GS.fontSerif,fontSize:18,fontWeight:600,color:C.text,marginBottom:14}}>Daily Health Check</div>

// ─── EGG & PHOTO ─────────────────────────────────────────────────────────────
function EggPhotoTab({hen}){
  const [eggSel,setEggSel]=useState(null);
  const [imgSrc,setImgSrc]=useState(null);
  const [imgB64,setImgB64]=useState(null);
  const [imgType,setImgType]=useState(null);
  const [analysing,setAnalysing]=useState(false);
  const [analysis,setAnalysis]=useState(null);
  const [photoMode,setPhotoMode]=useState("egg");
  const fileRef=useRef();
  const handleFile=async e=>{
    const file=e.target.files[0];if(!file)return;setAnalysis(null);
    const fr=new FileReader();fr.onload=ev=>setImgSrc(ev.target.result);fr.readAsDataURL(file);
    setImgB64(await toBase64(file));setImgType(file.type||"image/jpeg");
  };
  const analyse=async()=>{
    if(!imgB64)return;setAnalysing(true);
    const prompt=photoMode==="egg"?`You are a pet hen welfare expert. Analyse this egg photo from ${hen.name}. Identify: 1) Egg type, 2) What this indicates, 3) Practical next steps, 4) Whether a vet is needed.`:`You are a pet hen welfare expert. Analyse this photo of ${hen.name}. Observe: 1) Comb colour, 2) Feather quality, 3) Posture/alertness, 4) Any welfare concerns, 5) Whether a vet check is recommended.`;
    try{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:imgType,data:imgB64}},{type:"text",text:prompt}]}]})});const d=await res.json();setAnalysis(d.content?.map(b=>b.text||"").join("")||"Could not analyse.");}
    catch{setAnalysis("Error — please try again.");}setAnalysing(false);
  };
  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    <WhiteCard>
      <div style={{fontFamily:GS.fontSerif,fontSize:18,fontWeight:600,color:C.text,marginBottom:4}}>Egg Health Checker</div>
      <div style={{fontFamily:GS.fontSans,fontSize:12.5,color:C.textMuted,marginBottom:14}}>Tap what you're seeing, or upload a photo for AI analysis</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {EGG_TYPES.map(egg=><div key={egg.label} onClick={()=>setEggSel(egg)} style={{background:eggSel?.label===egg.label?egg.color+"12":C.bgMuted,border:`1.5px solid ${eggSel?.label===egg.label?egg.color:C.border}`,borderRadius:12,padding:"11px 13px",cursor:"pointer",display:"flex",alignItems:"center",gap:8,transition:"all 0.2s"}}>
          <span style={{fontSize:18}}>{egg.icon}</span><span style={{fontFamily:GS.fontSans,fontSize:12.5,color:C.text,fontWeight:eggSel?.label===egg.label?600:400}}>{egg.label}</span>
        </div>)}
      </div>
      {eggSel&&<div style={{marginTop:14,background:eggSel.color+"0D",border:`1px solid ${eggSel.color}33`,borderRadius:12,padding:"13px 15px"}}>
        <div style={{fontFamily:GS.fontSerif,fontSize:15,fontWeight:600,color:eggSel.color,marginBottom:5}}>{eggSel.icon} {eggSel.label}</div>
        <div style={{fontFamily:GS.fontSans,fontSize:13,color:C.text,lineHeight:1.7}}>{eggSel.advice}</div>
        <div style={{marginTop:8,fontSize:11,color:C.textMuted,fontStyle:"italic",fontFamily:GS.fontSans}}>⚕️ Not veterinary advice.</div>
      </div>}
    </WhiteCard>
    <WhiteCard>
      <div style={{fontFamily:GS.fontSerif,fontSize:18,fontWeight:600,color:C.text,marginBottom:12}}>AI Photo Analysis</div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        {[{key:"egg",label:"🥚 Analyse Egg"},{key:"hen",label:"🐓 Analyse Hen"}].map(m=><button key={m.key} onClick={()=>{setPhotoMode(m.key);setAnalysis(null);setImgSrc(null);setImgB64(null);}} style={{flex:1,background:photoMode===m.key?C.green:C.bgMuted,color:photoMode===m.key?"#fff":C.text,border:`1px solid ${photoMode===m.key?C.green:C.border}`,borderRadius:10,padding:"9px 0",fontSize:13,cursor:"pointer",fontFamily:GS.fontSans,fontWeight:photoMode===m.key?500:400,transition:"all 0.2s"}}>{m.label}</button>)}
      </div>
      <div onClick={()=>fileRef.current.click()} style={{border:`2px dashed ${C.border}`,borderRadius:14,padding:"26px 16px",textAlign:"center",cursor:"pointer",background:C.bgMuted,marginBottom:12,minHeight:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
        {imgSrc?<img src={imgSrc} alt="uploaded" style={{maxWidth:"100%",maxHeight:200,borderRadius:10,objectFit:"contain"}}/>:<div><div style={{fontSize:32,marginBottom:8}}>{photoMode==="egg"?"🥚":"📷"}</div><div style={{fontFamily:GS.fontSans,fontSize:13,color:C.textMid}}>Tap to upload photo</div></div>}
      </div>
      <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{display:"none"}}/>
      {imgSrc&&<div style={{display:"flex",gap:9}}>
        <button onClick={analyse} disabled={analysing} style={{flex:1,background:analysing?C.textMuted:C.gold,color:"#fff",border:"none",borderRadius:10,padding:"10px 0",fontFamily:GS.fontSans,fontSize:13,cursor:analysing?"default":"pointer",fontWeight:500}}>{analysing?"Analysing…":"✨ Analyse with AI"}</button>

      </div>}
      {analysis&&<AIBox label={`✨ Analysis — ${photoMode==="egg"?"Egg":hen.name}`} content={analysis} color={C.gold}/>}
    </WhiteCard>

}

  const [added,setAdded]=useState({});

  const [inviteOpen,setInviteOpen]=useState(false);

  const [inviteRole,setInviteRole]=useState("Co-keeper");
  const [inviteSent,setInviteSent]=useState(false);

    if(!question.trim())return;setAiLoading(true);setAiAnswer("");
    try{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`You are a knowledgeable UK pet hen welfare advisor. Answer warmly, practically, in under 200 words. Recommend a poultry vet for medical concerns.\n\nQuestion: ${question}`}]})});const d=await res.json();setAiAnswer(d.content?.map(b=>b.text||"").join("")||"Could not get an answer.");}
    catch{setAiAnswer("Error — please try again.");}setAiLoading(false);
  };

    {subTab==="feed"&&<>

        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:11}}>{Object.entries(TYPE).map(([k,cfg])=><button key={k} onClick={()=>setPostType(k)} style={{background:postType===k?cfg.color:C.bgMuted,color:postType===k?"#fff":C.textMid,border:`1px solid ${postType===k?cfg.color:C.border}`,borderRadius:20,padding:"5px 12px",fontSize:11.5,cursor:"pointer",fontFamily:GS.fontSans,fontWeight:postType===k?500:400}}>{cfg.label}</button>)}</div>
        <button onClick={()=>{if(!newPost.trim())return;setPosts(p=>[{id:`p${Date.now()}`,user:"Sarah",initials:"S",time:"Just now",type:postType,content:newPost,tags:[],likes:0,comments:0,location:"South East England"},...p]);setNewPost("");}} disabled={!newPost.trim()} style={{background:newPost.trim()?C.green:C.border,color:"#fff",border:"none",borderRadius:10,padding:"9px 18px",fontFamily:GS.fontSans,fontSize:13,cursor:newPost.trim()?"pointer":"default",fontWeight:500}}>Share with Community</button>
      </WhiteCard>
      {posts.map(post=><WhiteCard key={post.id} style={{marginBottom:12}}>
        <div style={{display:"flex",gap:10,marginBottom:10}}><UserAvatar initials={post.initials} size={38}/><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}><span style={{fontFamily:GS.fontSans,fontWeight:600,fontSize:14,color:C.text}}>{post.user}</span><span style={{background:TYPE[post.type]?.bg,color:TYPE[post.type]?.color,borderRadius:20,padding:"2px 9px",fontSize:10.5,fontFamily:GS.fontSans,fontWeight:500}}>{TYPE[post.type]?.label}</span></div><div style={{fontFamily:GS.fontSans,fontSize:11,color:C.textMuted,marginTop:2}}>📍 {post.location} · {post.time}</div></div></div>

          <button style={{background:C.blueLight,color:C.blue,border:`1px solid ${C.blue}33`,borderRadius:9,padding:"6px 12px",fontSize:12,cursor:"pointer",fontFamily:GS.fontSans,fontWeight:500}}>Message</button>

          <button onClick={()=>setAdded(p=>({...p,[f.name]:true}))} style={{background:added[f.name]?C.greenLight:C.green,color:added[f.name]?C.green:"#fff",border:`1px solid ${added[f.name]?C.green+"44":C.green}`,borderRadius:9,padding:"6px 12px",fontSize:12,cursor:"pointer",fontFamily:GS.fontSans,fontWeight:500}}>{added[f.name]?"✓ Added":"+ Add"}</button>
        </div>)}
      </WhiteCard>
    </>}

    </>}

    {subTab==="ask"&&<>
      <GreenCard style={{marginBottom:16}}><div style={{fontFamily:GS.fontSerif,fontSize:22,fontWeight:600,color:"#F5F0E8",marginBottom:3}}>✨ Ask the Hen Advisor</div><div style={{fontFamily:GS.fontSans,fontSize:12.5,color:"rgba(255,255,255,0.6)",lineHeight:1.6}}>AI-powered, evidence-based answers for UK hen keepers.</div></GreenCard>
      <WhiteCard style={{marginBottom:14}}>
        <textarea value={question} onChange={e=>setQuestion(e.target.value)} placeholder="Ask anything about hen welfare, nutrition, behaviour, egg laying, moulting, seasonal care…" style={{width:"100%",minHeight:85,padding:"11px 13px",borderRadius:10,border:`1px solid ${C.border}`,fontFamily:GS.fontSans,fontSize:13,color:C.text,background:C.bgMuted,resize:"none",boxSizing:"border-box",outline:"none",lineHeight:1.6}}/>
        <button onClick={askAI} disabled={aiLoading||!question.trim()} style={{marginTop:11,background:aiLoading?C.textMuted:C.green,color:"#fff",border:"none",borderRadius:10,padding:"10px 18px",fontFamily:GS.fontSans,fontSize:13,cursor:aiLoading?"default":"pointer",opacity:!question.trim()?0.4:1,fontWeight:500}}>{aiLoading?"Thinking…":"Ask ✨"}</button>
        {aiAnswer&&<AIBox label="✨ Hen Advisor:" content={aiAnswer} color={C.green}/>}
      </WhiteCard>
      <WhiteCard>
        <div style={{fontFamily:GS.fontSerif,fontSize:17,fontWeight:600,color:C.text,marginBottom:12}}>Popular questions</div>
        {["What are the signs of red mite infestation?","How long does a moult usually last?","Should I separate a broody hen?","What's the best natural worming approach?"].map(q=><button key={q} onClick={()=>setQuestion(q)} style={{display:"block",width:"100%",textAlign:"left",background:C.bgMuted,border:`1px solid ${C.border}`,borderRadius:10,padding:"11px 13px",marginBottom:8,fontFamily:GS.fontSans,fontSize:13,color:C.text,cursor:"pointer",lineHeight:1.4}}>{q} <span style={{color:C.textMuted}}>→</span></button>)}
      </WhiteCard>
    </>}
  </div>;
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function FlockAndFeatherApp(){
  const [mainTab,setMainTab]=useState("care");
  const [activeHen,setActiveHen]=useState(null);
  const [hens,setHens]=useState([]);
  const [memorialHens,setMemorialHens]=useState([]);
  const [flockTasks,setFlockTasks]=useState({});

  const NAV=[
    {key:"care",   label:"CARE",     Icon:NavCare},
    {key:"flock",  label:"FLOCK",    Icon:NavFlock},
    {key:"health", label:"HEALTH",   Icon:NavHealth},
    {key:"vets",   label:"VETS",     Icon:NavVets},
    {key:"community",label:"CONNECT",Icon:NavComm},
  ];

  return <div style={{minHeight:"100vh",background:C.bg,paddingBottom:76}}>
    <style>{`@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap');*{box-sizing:border-box;}::-webkit-scrollbar{width:3px;height:3px;}::-webkit-scrollbar-thumb{background:${C.border};border-radius:2px;}input,textarea,select{-webkit-appearance:none;}`}</style>

    <AppHeader hens={hens} flockTasks={flockTasks}/>

    {mainTab==="flock"&&activeHen&&<div style={{background:C.bgCard,borderBottom:`1px solid ${C.borderLight}`,padding:"9px 20px",display:"flex",alignItems:"center",gap:8}}>
      <button onClick={()=>setActiveHen(null)} style={{background:"none",border:"none",color:C.textMid,fontFamily:GS.fontSans,fontSize:13,cursor:"pointer",padding:0,display:"flex",alignItems:"center",gap:5}}>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><polyline points="9,2 4,7 9,12" stroke={C.textMid} strokeWidth="1.5" strokeLinecap="round"/></svg>Flock
      </button>
      <span style={{color:C.border,fontSize:14}}>/</span>
      <span style={{fontFamily:GS.fontSans,fontSize:13,color:C.text,fontWeight:500}}>{activeHen.emoji} {activeHen.name}</span>
    </div>}

    <div style={{maxWidth:560,margin:"0 auto",padding:"18px 18px 0"}}>
      {mainTab==="care"&&<CareTab hens={hens} flockTasks={flockTasks} setFlockTasks={setFlockTasks}/>}
      {mainTab==="flock"&&(activeHen
        ?<HenProfile hen={activeHen} onBack={()=>setActiveHen(null)}/>
        :<FlockTab hens={hens} setHens={setHens} memorialHens={memorialHens} setMemorialHens={setMemorialHens} setActiveHen={setActiveHen}/>)}
      {mainTab==="health"&&<HealthTab/>}
      {mainTab==="vets"&&<VetTab/>}
      {mainTab==="community"&&<CommunityTab/>}
    </div>

    <div style={{position:"fixed",bottom:0,left:0,right:0,background:C.bgCard,borderTop:`1px solid ${C.borderLight}`,zIndex:100}}>
      <div style={{maxWidth:560,margin:"0 auto",display:"flex"}}>
        {NAV.map(n=>{const active=mainTab===n.key;return <button key={n.key} onClick={()=>{setMainTab(n.key);if(n.key!=="flock")setActiveHen(null);}} style={{flex:1,background:"none",border:"none",padding:"10px 0 12px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
          {active&&<div style={{width:5,height:5,borderRadius:"50%",background:C.green,marginBottom:1}}/>}
          <n.Icon a={active}/>
          <span style={{fontFamily:GS.fontSans,fontSize:9,color:active?C.green:C.textMuted,fontWeight:active?600:400,letterSpacing:"0.07em"}}>{n.label}</span>
        </button>;})}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(FlockAndFeatherApp));
</script>
</body>
</html>
